<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<meta name="description" content="Certificações e cursos concluídos de Lucas Martins Lima.">
<title>Certificações | Lucas Martins Lima</title>
<style>
:root{color-scheme:light;--paper:#f7f8fa;--white:#fff;--ink:#121a27;--muted:#657080;--soft:#8a94a2;--line:#dfe4ea;--accent:#174a83;--radius:10px;--content:1040px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:18px}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}a{color:inherit}.site-shell{width:min(var(--content),calc(100% - 56px));margin:0 auto}.site-header{min-height:74px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}.monogram{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;border:1px solid #cbd4df;border-radius:50%;color:var(--accent);text-decoration:none;font-size:13px;font-weight:750;letter-spacing:-.05em}.header-name{font-size:13px;font-weight:650;letter-spacing:-.01em}.intro{padding:54px 0 42px;max-width:710px}.intro h1{margin:0;font-size:clamp(43px,7vw,70px);font-weight:680;line-height:1.02;letter-spacing:-.075em}.intro h1 span{color:var(--accent)}.intro-rule{display:flex;gap:5px;margin-top:25px}.intro-rule span{display:block;width:26px;height:3px;border-radius:5px;background:var(--accent)}.intro-rule span:nth-child(2){width:11px;opacity:.45}.intro-rule span:nth-child(3){width:5px;opacity:.2}.content-section{padding:26px 0 56px;border-top:1px solid var(--line)}.section-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px;gap:16px}.eyebrow{margin:0;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.14em;line-height:1.5}.section-heading h2{margin:6px 0 0;font-size:27px;font-weight:650;letter-spacing:-.05em;line-height:1.2}.section-count{color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums}.course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:14px}.credential-card{min-width:0;min-height:222px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--white)}.credential-main{min-width:0;flex:1}.card-topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.type-label{display:inline-block;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.card-date{color:var(--soft);font-size:11px;white-space:nowrap}.credential-card h3{margin:13px 0 3px;font-size:18px;line-height:1.3;font-weight:670;letter-spacing:-.035em}.issuer{margin:0;color:var(--muted);font-size:12px}.course-details{margin:11px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.qr-wrap{display:flex;flex:0 0 106px;flex-direction:column;align-items:center;gap:7px;margin:auto 0}.qr-wrap img{display:block;width:106px;height:106px;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff}.qr-wrap span{max-width:112px;color:var(--soft);font-size:7px;font-weight:800;letter-spacing:.08em;text-align:center;line-height:1.4}.document-tile{width:106px;min-height:106px;display:flex;flex:0 0 106px;flex-direction:column;align-items:center;justify-content:center;gap:5px;margin:auto 0;padding:9px;border:1px solid var(--line);border-radius:6px;background:#fbfcfd;text-align:center;text-decoration:none}.document-tile svg{width:28px;height:28px;color:var(--accent)}.document-tile strong{font-size:8px;letter-spacing:.08em;color:var(--ink)}.document-tile small{font-size:7px;line-height:1.35;color:var(--soft);letter-spacing:.04em}.document-tile.is-ready{border-color:#cbd8e5;background:#f8fbff}.document-tile.is-ready:hover{border-color:var(--accent)}.credential-code{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:10px;border-top:1px solid #edf0f3}.credential-code>span{display:grid;min-width:0;gap:3px}.credential-code small{color:var(--soft);font-size:8px;font-weight:750;letter-spacing:.1em}.credential-code code{overflow-wrap:anywhere;color:#515d6d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px}.copy-button{flex:0 0 auto;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--muted);font:inherit;font-size:10px;cursor:pointer}.copy-button:hover{border-color:#b8c8d9;color:var(--accent)}.course-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:9px;color:var(--muted);font-size:10px;line-height:1.5}.course-meta i{width:3px;height:3px;flex:0 0 3px;border-radius:50%;background:#aab3bd}.period-note{margin:6px 0 0;color:var(--soft);font-size:10px}.card-actions{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:12px}.validation-link,.certificate-link{display:inline-flex;gap:5px;align-items:center;color:var(--accent);font-size:11px;font-weight:700;text-decoration:none}.certificate-link{color:#526273}.validation-link:hover,.certificate-link:hover{text-decoration:underline}.toast{position:fixed;left:50%;bottom:22px;z-index:10;transform:translate(-50%,12px);padding:9px 14px;border-radius:7px;background:var(--ink);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:760px){.site-shell{width:min(100% - 36px,var(--content))}.site-header{min-height:66px}.intro{padding:48px 0 34px}.intro h1{font-size:clamp(43px,12vw,64px)}.course-grid{grid-template-columns:1fr}}@media(max-width:480px){.site-shell{width:calc(100% - 30px)}.header-name{font-size:12px}.monogram{width:37px;height:37px;flex-basis:37px}.credential-card{min-height:190px;padding:15px;gap:10px}.qr-wrap,.document-tile{flex-basis:78px;width:78px}.qr-wrap img{width:78px;height:78px}.qr-wrap span{font-size:6px}.document-tile{min-height:78px;padding:5px}.document-tile svg{width:22px;height:22px}.document-tile strong{font-size:7px}.document-tile small{font-size:6px}.card-topline{align-items:start;flex-direction:column;gap:3px}.section-heading h2{font-size:23px}}@media print{body{background:#fff}.site-shell{width:100%}.copy-button,.toast{display:none!important}.credential-card{break-inside:avoid}}
</style>
</head>
<body>
<div class="site-shell">
<header class="site-header"><a class="monogram" href="#certificacoes" aria-label="Ir para as certificações">LM</a><span class="header-name">Lucas Martins Lima</span></header>
<main>
<section class="intro" aria-labelledby="page-title"><h1 id="page-title">Cursos &amp;<br><span>Certificações.</span></h1><div class="intro-rule" aria-hidden="true"><span></span><span></span><span></span></div></section>
<section class="content-section" id="certificacoes" aria-labelledby="credentials-title"><div class="section-heading"><div><p class="eyebrow">01 / CREDENCIAIS DIGITAIS</p><h2 id="credentials-title">Certificações e cursos concluídos</h2></div><span class="section-count" id="credential-count">06</span></div><div class="course-grid" id="credentials-grid" aria-live="polite"></div></section>
</main></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/*
  PORTFÓLIO EM ARQUIVO ÚNICO.
  Para adicionar cursos, duplique um objeto do array credentials.
  Os PDFs devem ficar na pasta certificados/ com os nomes exatos abaixo.
  Os QR Codes apontam somente para páginas de credencial ou validação.
*/
const credentials = [
  {name:"Cybersecurity Fundamentals",issuer:"IBM SkillsBuild",date:"13/11/2026",details:"Conhecimentos fundamentais de cibersegurança.",code:"7d420e2c-29be-4114-aad8-592853aeb365",validationUrl:"https://www.credly.com/earner/earned/badge/7d420e2c-29be-4114-aad8-592853aeb365",validationLabel:"Ver credencial na Credly",qrLabel:"CREDLY · VER CREDENCIAL",badge:"CREDENCIAL DIGITAL",validity:"Não expira",certificateFile:"certificados/ibmcybersecurityfundamentals2026.pdf",qrUrl:"https://www.credly.com/earner/earned/badge/7d420e2c-29be-4114-aad8-592853aeb365"},
  {name:"Networking Basics",issuer:"Cisco",date:"12/11/2026",details:"Fundamentos de redes de computadores.",code:"ad0da16f-b66d-4907-917f-2b5fbeed7f6a",validationUrl:"https://www.credly.com/earner/earned/badge/ad0da16f-b66d-4907-917f-2b5fbeed7f6a",validationLabel:"Ver credencial na Credly",qrLabel:"CREDLY · VER CREDENCIAL",badge:"CREDENCIAL DIGITAL",validity:"Não expira",certificateFile:"certificados/cisconetworkingbasics2026.pdf",qrUrl:"https://www.credly.com/earner/earned/badge/ad0da16f-b66d-4907-917f-2b5fbeed7f6a"},
  {name:"Entender o Microsoft Entra ID",issuer:"Microsoft Learn",date:"05/12/2025",details:"Módulo de aprendizagem concluído na plataforma Microsoft Learn.",badge:"CURSO CONCLUÍDO",moduleUrl:"https://learn.microsoft.com/pt-br/training/modules/understand-azure-active-directory/",moduleLabel:"Consultar módulo no Microsoft Learn",certificateFile:"certificados/microsoftentraid2025.pdf"},
  {name:"Introdução ao Azure Cloud Shell",issuer:"Microsoft Learn",date:"04/12/2025",details:"Módulo de aprendizagem concluído na plataforma Microsoft Learn.",badge:"CURSO CONCLUÍDO",moduleUrl:"https://learn.microsoft.com/pt-br/training/modules/intro-to-azure-cloud-shell/",moduleLabel:"Consultar módulo no Microsoft Learn",certificateFile:"certificados/microsoftazurecloudshell2025.pdf"},
  {name:"SEI! Usar 4.0",issuer:"Escola Nacional de Administração Pública (ENAP)",date:"03/11/2025",details:"Curso de utilização do Sistema Eletrônico de Informações.",code:"g9M7195429369YFh",validationUrl:"https://www.escolavirtual.gov.br/documentos/validacao",validationLabel:"Validar certificado na EV.G",qrLabel:"EV.G · VALIDAR CÓDIGO",badge:"CERTIFICADO DE CONCLUSÃO",hours:"25 horas",score:"Nota final: 100/100",validity:"Certificado emitido em 03/11/2025",period:"Período: 30/10/2025 a 29/11/2025",certificateFile:"certificados/enapseiusar402025.pdf",qrUrl:"https://www.escolavirtual.gov.br/documentos/validacao"},
  {name:"Redes de Computadores",issuer:"Instituto Federal de Educação, Ciência e Tecnologia do Rio Grande do Sul (IFRS)",date:"27/10/2025",details:"Curso realizado no âmbito da plataforma Aprenda Mais.",code:"68ff71ee-9e74-4666-8969-7edfac1f03c",validationUrl:"https://aprendamais.mec.gov.br/mod/simplecertificate/verify.php",validationLabel:"Abrir validação no Aprenda Mais",qrLabel:"APRENDA MAIS · VALIDAR CÓDIGO",badge:"CERTIFICADO DE CONCLUSÃO",hours:"30 horas",score:"89,29% de aproveitamento",period:"Período: 20/10/2025 a 27/10/2025",certificateFile:"certificados/ifrsredesdecomputadores2025.pdf",qrUrl:"https://aprendamais.mec.gov.br/mod/simplecertificate/verify.php"}
];

const grid=document.getElementById('credentials-grid');
const count=document.getElementById('credential-count');
const toast=document.getElementById('toast');
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function iconDocument(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>';}
function qrImage(url){return 'https://api.qrserver.com/v1/create-qr-code/?size=106x106&format=png&data='+encodeURIComponent(url);}
function renderMeta(course){const items=[];if(course.hours)items.push(course.hours);if(course.score)items.push(course.score);if(course.validity)items.push(course.validity);return items.length?'<div class="course-meta">'+items.map((item,i)=>(i?'<i aria-hidden="true"></i>':'')+'<span>'+escapeHTML(item)+'</span>').join('')+'</div>':'';}
function renderCode(course){if(!course.code)return '';return `<div class="credential-code"><span><small>CÓDIGO / ID</small><code>${escapeHTML(course.code)}</code></span><button class="copy-button" type="button" data-copy="${escapeHTML(course.code)}" aria-label="Copiar código do certificado">Copiar</button></div>`;}
function renderMedia(course){if(course.qrUrl)return `<div class="qr-wrap"><img src="${qrImage(course.qrUrl)}" alt="QR Code para ${escapeHTML(course.qrLabel||course.name)}" width="106" height="106" loading="lazy"><span>${escapeHTML(course.qrLabel||'ESCANEIE PARA CONSULTAR')}</span></div>`;if(course.pdfAvailable)return `<a class="document-tile is-ready" href="${escapeHTML(course.certificateFile)}" target="_blank" rel="noopener noreferrer" aria-label="Abrir certificado em PDF">${iconDocument()}<strong>ABRIR PDF</strong><small>CERTIFICADO</small></a>`;return `<div class="document-tile" aria-label="Certificado PDF ainda não adicionado">${iconDocument()}<strong>PDF A ADICIONAR</strong><small>ARQUIVO NA PASTA CERTIFICADOS</small></div>`;}
function renderActions(course){const links=[];if(course.validationUrl)links.push(`<a class="validation-link" href="${escapeHTML(course.validationUrl)}" target="_blank" rel="noopener noreferrer">${escapeHTML(course.validationLabel||'Consultar credencial')} <span aria-hidden="true">↗</span></a>`);if(course.moduleUrl)links.push(`<a class="validation-link" href="${escapeHTML(course.moduleUrl)}" target="_blank" rel="noopener noreferrer">${escapeHTML(course.moduleLabel||'Consultar módulo')} <span aria-hidden="true">↗</span></a>`);if(course.qrUrl&&course.pdfAvailable)links.push(`<a class="certificate-link" href="${escapeHTML(course.certificateFile)}" target="_blank" rel="noopener noreferrer">Abrir certificado PDF ↗</a>`);return links.length?`<div class="card-actions">${links.join('')}</div>`:'';}
function renderCard(course){return `<article class="credential-card"><div class="credential-main"><div class="card-topline"><span class="type-label">${escapeHTML(course.badge||'CREDENCIAL DIGITAL')}</span><span class="card-date">${escapeHTML(course.date||'')}</span></div><h3>${escapeHTML(course.name)}</h3><p class="issuer">${escapeHTML(course.issuer)}</p>${course.details?`<p class="course-details">${escapeHTML(course.details)}</p>`:''}${renderMeta(course)}${course.period?`<p class="period-note">${escapeHTML(course.period)}</p>`:''}${renderCode(course)}${renderActions(course)}</div>${renderMedia(course)}</article>`;}
async function pdfExists(path){if(!path||location.protocol==='file:')return false;try{const response=await fetch(path,{method:'HEAD',cache:'no-store'});return response.ok;}catch{return false;}}
async function initialize(){await Promise.all(credentials.map(async course=>{course.pdfAvailable=await pdfExists(course.certificateFile);}));grid.innerHTML=credentials.map(renderCard).join('');count.textContent=String(credentials.length).padStart(2,'0');}
initialize();
let toastTimer;
function showToast(message){toast.textContent=message;toast.classList.add('show');window.clearTimeout(toastTimer);toastTimer=window.setTimeout(()=>toast.classList.remove('show'),1700);}
document.addEventListener('click',async event=>{const button=event.target.closest('[data-copy]');if(!button)return;const value=button.getAttribute('data-copy');try{await navigator.clipboard.writeText(value);showToast('Código copiado.');}catch{const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();showToast(ok?'Código copiado.':'Não foi possível copiar automaticamente.');}});
</script>
</body>
</html>
